name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 1.21 = declared floor in go.mod; 1.26 = latest stable.
        go: ["1.21", "1.26"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
      - run: go version
      # `make test` runs gofmt + vet + race + shuffle + 100% coverage gate.
      - run: make test

  e2e:
    name: e2e (cross-check vs aws-sdk-go-v2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          check-latest: true
      - run: make e2e
