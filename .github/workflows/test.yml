name: test

on:
  push:
    branches: [main]
  pull_request:

# setup-go@v6 sets GOTOOLCHAIN=local by default, which blocks Go from
# auto-downloading a newer toolchain to satisfy a higher `go` directive
# in any go.mod we touch. The matrix `test` job runs `make test`, which
# vets both modules (root + e2e/). The e2e/ module declares `go 1.24`,
# so when the matrix runs on Go 1.21 it must be allowed to fetch 1.24
# transparently — hence GOTOOLCHAIN=auto, restoring v5's behaviour.
env:
  GOTOOLCHAIN: auto

jobs:
  test:
    name: test (go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 1.21 = declared floor in go.mod; 1.26 = latest stable.
        go: ["1.21", "1.26"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
          # skipstone has no runtime deps and therefore no go.sum.
          # Disable setup-go's module cache to silence the
          # "Dependencies file is not found" warning.
          cache: false
      - run: go version
      # `make test` runs gofmt + vet + race + shuffle + 100% coverage gate.
      - run: make test

  e2e:
    name: e2e (cross-check vs aws-sdk-go-v2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          check-latest: true
          # The e2e/ module does pull aws-sdk-go-v2 + a go.sum, but
          # we keep cache off here too so both jobs behave the same.
          cache: false
      - run: make e2e
